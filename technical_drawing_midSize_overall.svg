<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #fafafa;">
    <style>
        .profile { fill: #e0e0e0; stroke: #333; stroke-width: 2.5; stroke-linejoin: round; }
        .dim-line { fill: none; stroke: #0056b3; stroke-width: 1.5; }
        .dim-tick { fill: none; stroke: #0056b3; stroke-width: 1.5; }
        .dim-ext { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 4,4; }
        .text { font-family: monospace; font-size: 14px; fill: #0056b3; text-anchor: middle; }
        .text-left { font-family: monospace; font-size: 14px; fill: #0056b3; text-anchor: start; }
        .title { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #222; }
        .subtitle { font-family: sans-serif; font-size: 14px; fill: #555; }
    </style>
    
    <text x="400" y="40" class="title" text-anchor="middle">RAKO Box (midSize) - Overall Cross-Section</text>
    <text x="400" y="60" class="subtitle" text-anchor="middle">Scale: 1mm = 1px | Dimensions in mm</text>
    
    <!-- Cross-Section Profile Path -->
    <!-- X: 200 to 600, Y: 100 (top) to 270 (bottom) -->
    <path class="profile" d="
        M 200.0 100.0 
        L 200.12 105.0
        L 212.12 105.0
        L 212.59 125.0
        L 201.59 125.0
        L 201.68 129.0
        L 212.68 129.0
        L 215.67 256.0
        L 204.67 256.0
        L 204.76 260.0
        L 216.76 260.0 
        L 217.0 270.0 
        L 583.0 270.0 
        L 583.24 260.0 
        L 595.24 260.0
        L 595.33 256.0
        L 584.33 256.0
        L 587.32 129.0
        L 598.32 129.0
        L 598.41 125.0
        L 587.41 125.0
        L 587.88 105.0
        L 599.88 105.0
        L 600.0 100.0 
        L 584.0 100.0 
        L 580.09 266.0 
        L 219.91 266.0 
        L 216.0 100.0 
        Z" />
        
    <!-- Outer Length Top (400) -->
    <line x1="200" y1="100" x2="200" y2="70" class="dim-ext" />
    <line x1="600" y1="100" x2="600" y2="70" class="dim-ext" />
    <line x1="200" y1="80" x2="600" y2="80" class="dim-line" />
    <line x1="200" y1="75" x2="200" y2="85" class="dim-tick" />
    <line x1="600" y1="75" x2="600" y2="85" class="dim-tick" />
    <text x="400" y="75">400 (Outer Length Top)</text>
    
    <!-- Inner Length Top (368) -->
    <line x1="216" y1="100" x2="216" y2="120" class="dim-ext" />
    <line x1="584" y1="100" x2="584" y2="120" class="dim-ext" />
    <line x1="216" y1="115" x2="584" y2="115" class="dim-line" />
    <line x1="216" y1="110" x2="216" y2="120" class="dim-tick" />
    <line x1="584" y1="110" x2="584" y2="120" class="dim-tick" />
    <text x="400" y="110">368 (Inner Length Top)</text>

    <!-- Outer Length Bottom (392 approx without foot) -->
    <line x1="204" y1="260" x2="204" y2="300" class="dim-ext" />
    <line x1="596" y1="260" x2="596" y2="300" class="dim-ext" />
    <line x1="204" y1="290" x2="596" y2="290" class="dim-line" />
    <line x1="204" y1="285" x2="204" y2="295" class="dim-tick" />
    <line x1="596" y1="285" x2="596" y2="295" class="dim-tick" />
    <text x="400" y="305">392 (Outer Base Width)</text>
    
    <!-- Foot Width Bottom (366) -->
    <line x1="217" y1="270" x2="217" y2="340" class="dim-ext" />
    <line x1="583" y1="270" x2="583" y2="340" class="dim-ext" />
    <line x1="217" y1="330" x2="583" y2="330" class="dim-line" />
    <line x1="217" y1="325" x2="217" y2="335" class="dim-tick" />
    <line x1="583" y1="325" x2="583" y2="335" class="dim-tick" />
    <text x="400" y="345">366 (Stacking Foot Width)</text>

    <!-- Inner Length Bottom (360) -->
    <line x1="220" y1="266" x2="220" y2="245" class="dim-ext" />
    <line x1="580" y1="266" x2="580" y2="245" class="dim-ext" />
    <line x1="220" y1="250" x2="580" y2="250" class="dim-line" />
    <line x1="220" y1="245" x2="220" y2="255" class="dim-tick" />
    <line x1="580" y1="245" x2="580" y2="255" class="dim-tick" />
    <text x="400" y="245">360 (Inner Length Bottom)</text>

    <!-- Total Height (170) -->
    <line x1="200" y1="100" x2="150" y2="100" class="dim-ext" />
    <line x1="216" y1="270" x2="150" y2="270" class="dim-ext" />
    <line x1="160" y1="100" x2="160" y2="270" class="dim-line" />
    <line x1="155" y1="100" x2="165" y2="100" class="dim-tick" />
    <line x1="155" y1="270" x2="165" y2="270" class="dim-tick" />
    <text x="150" y="185" transform="rotate(-90 150 185)">170 (Total Height)</text>

    <!-- Inner Height (166) -->
    <line x1="400" y1="100" x2="400" y2="266" class="dim-line" />
    <line x1="395" y1="100" x2="405" y2="100" class="dim-tick" />
    <line x1="395" y1="266" x2="405" y2="266" class="dim-tick" />
    <text x="410" y="185" class="text-left">166 (Inner Depth)</text>

    <!-- Wall Thickness (16) -->
    <line x1="200" y1="100" x2="200" y2="150" class="dim-ext" />
    <line x1="216" y1="100" x2="216" y2="150" class="dim-ext" />
    <line x1="200" y1="140" x2="216" y2="140" class="dim-line" />
    <text x="175" y="145" class="text">16</text>
    
    <!-- Draft Angle -->
    <line x1="200" y1="100" x2="200" y2="280" class="dim-ext" />
    <line x1="200" y1="270" x2="216" y2="270" class="dim-line" />
    <text x="180" y="275" class="text">4.0</text>
    
</svg>
